[project]
name = "taskflow"
version = "0.1.0"
description = "异步优先的可靠任务消息框架"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiosqlite>=0.20", "typing-extensions>=4.4"]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 85

[tool.ruff.lint.per-file-ignores]
"src/taskflow/broker/sqlite.py" = ["PYI019"]
