[project]
name = "taskflow"
version = "0.6.0.dev0"
description = "异步优先的可靠任务消息框架"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["aiosqlite>=0.20", "typing-extensions>=4.4"]

[project.scripts]
taskflow = "taskflow.cli:main"

[project.optional-dependencies]
redis = ["redis>=5.0"]
pydantic = ["pydantic>=2,<3"]
tui = ["textual>=0.58", "prompt-toolkit>=3.0"]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskflow"]

[tool.hatch.build.targets.wheel.force-include]
"src/taskflow/py.typed" = "taskflow/py.typed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "redis: requires a reachable Redis server; never silently skipped in release CI",
]

[tool.coverage.report]
fail_under = 85

[tool.ruff.lint.per-file-ignores]
"src/taskflow/broker/sqlite.py" = ["PYI019"]
